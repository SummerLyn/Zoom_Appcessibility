{% extends "base.html" %}

{% block zoom_content %}

<a href="{% url 'property_description' property_id %}"><h3> Go back to property listing! </h3></a>

<div class="gallery-container">
{% for picture in photo_gallery %}
    <div class="gallery-item">
        <img src='{{ picture.photo.url }}'
             alt="Gallery photo for property"  
             width='150' height='150'
             loading="lazy"
             style="object-fit: cover; cursor: pointer;"
             onclick="openLightbox('{{ picture.photo.url }}')"/>
    </div>
{% empty %}
    <p>No photos available for this property.</p>
{% endfor %}
</div>

<!-- Simple lightbox modal -->
<div id="lightbox" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; cursor: pointer;" onclick="closeLightbox()">
    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
        <img id="lightbox-img" src="" style="max-width: 90vw; max-height: 90vh;" />
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
function openLightbox(src) {
    document.getElementById('lightbox').style.display = 'block';
    document.getElementById('lightbox-img').src = src;
}

function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
}
</script>
{% endblock %}
